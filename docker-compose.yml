version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: vlogforge_db
    environment:
      POSTGRES_USER: vlogforge
      POSTGRES_PASSWORD: vlogforge_password
      POSTGRES_DB: vlogforge_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  postgres_data:
