name: vlogforge
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.11
  - ffmpeg
  - pip
  - pip:
      - fastapi
      - uvicorn[standard]
      - websockets
      - python-multipart
      - pydantic-settings
      - python-dotenv
      - faster-whisper
      - whisperx                 # forced word alignment (pulls in torch)
      - anthropic                # edit passes, story plan, post copy
      - pillow                   # B-roll shot thumbnails
      - scenedetect[opencv]      # B-roll shot index (ENABLE_BROLL, off in the MVP)
      - opencv-python-headless
      - pytest
      # Database + auth
      - sqlalchemy
      - alembic
      - asyncpg
      - psycopg2-binary
      - passlib[bcrypt]
      - python-jose[cryptography]

